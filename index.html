<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plate">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Plate</title>
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1b1f1c;--muted:#68706a;--line:#e1e5df;--acc:#1f7a4d;--acc-soft:#e2f0e8;--warn:#b4541f;--p:#3b6fd8;--c:#c9901a;--f:#c2477a;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#111412;--card:#1a1e1b;--ink:#e8ece9;--muted:#9aa39c;--line:#2a302c;--acc:#4cbf85;--acc-soft:#1e3328;--warn:#e08a55;--p:#7aa2ff;--c:#e2b04a;--f:#e57aa5}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 24px}
h1{font-size:24px;margin:4px 0 12px}
h2{font-size:16px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--acc);color:#fff;font-weight:600;white-space:nowrap}
.btn.ghost{background:var(--acc-soft);color:var(--acc)}
.btn.plain{background:none;color:var(--acc);padding:8px 4px}
.btn.danger{background:none;color:var(--warn);padding:8px 4px}
.btn.block{display:block;width:100%;margin-top:10px}
.btn:disabled{opacity:.5}
input,select{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.row{display:flex;gap:10px;align-items:center}
.row>.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}.right{text-align:right}
.datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.datebar button{border:0;background:var(--card);border:1px solid var(--line);border-radius:10px;width:44px;height:40px;font-size:20px}
.datebar .lbl{font-weight:700;font-size:18px;background:none;border:0;color:var(--ink);margin:0}
.big{font-size:44px;font-weight:750;line-height:1;letter-spacing:-1px}
.big.over{color:var(--warn)}
.eq{display:flex;justify-content:space-between;margin-top:12px;font-size:13px;color:var(--muted)}
.eq b{display:block;font-size:17px;color:var(--ink)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:4px 0 0}
.bar>i{display:block;height:100%;border-radius:4px}
.macros{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:14px;font-size:13px}
.mealhead{display:flex;justify-content:space-between;align-items:center}
.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.item:first-of-type{border-top:0}
.item .nm{font-weight:550;overflow-wrap:anywhere}
.item .sub{font-size:13px;color:var(--muted)}
.item .kc{font-weight:600;white-space:nowrap}
.list .item:first-child{border-top:0}
.addrow{display:block;width:100%;text-align:left;border:0;background:none;color:var(--acc);font-weight:600;padding:10px 0 2px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:8px 0 6px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button.on{color:var(--acc);font-weight:600}
.tabs svg{width:24px;height:24px}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .inner{max-width:560px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;min-height:44px}
.sheethead b{font-size:17px;text-align:center;flex:1}
.sheethead>span,.sheethead>button{min-width:64px}
.hidden{display:none}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;gap:3px;margin:12px 0}
.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:8px;font-size:14px}
.seg button.on{background:var(--card);font-weight:600}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tools .btn{flex:1;padding:10px 8px;font-size:14px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--acc-soft);color:var(--acc);margin-left:4px;vertical-align:1px}
.tot{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-top:14px}
.tot div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 4px}
.tot b{display:block;font-size:20px}
.tot span{font-size:12px;color:var(--muted)}
.banner{background:#fff3cf;color:#5f4500;font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:12px}
@media (prefers-color-scheme:dark){.banner{background:#3a3014;color:#f3dc9a}}
.pill{font-size:12px;background:var(--line);border-radius:20px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.code{font:700 26px/1.2 ui-monospace,Menlo,monospace;letter-spacing:3px;text-align:center;padding:12px;background:var(--bg);border-radius:10px;margin:10px 0;user-select:all}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stats b{display:block;font-size:22px}
.stats span{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;z-index:50;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.auth{max-width:400px;padding-top:calc(48px + env(safe-area-inset-top))}
.auth img{width:72px;height:72px;border-radius:16px;display:block;margin:0 auto 8px}
#reader{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:240px}
#reader video{width:100%!important;display:block}
.chk{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:15px;color:var(--ink)}
.chk input{width:22px;height:22px}
svg text{font-size:10px;fill:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
.toast.on.act{pointer-events:auto}
.toast button{background:none;border:0;color:#7fe0ad;font-weight:700;margin-left:12px;padding:0}
.copyrow{display:block;width:100%;text-align:left;border:0;background:none;color:var(--muted);font-size:14px;padding:8px 0 0}
.copyrow b{color:var(--acc)}
details.card summary{font-weight:600;cursor:pointer;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:' ›';color:var(--muted)}
details[open].card summary::after{content:' ⌄'}
.star{border:0;background:none;font-size:26px;line-height:1;color:var(--muted);padding:4px}
.star.on{color:#e0a800}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet hidden"><div class="inner"></div></div>
<div id="toast" class="toast"></div>
<script src="config.js"></script>
<script type="module">
/* ================= Basics ================= */
const CFG = window.PLATE_CONFIG || {};
const FB = CFG.firebase || {};
const DEMO = !FB.apiKey;
const USDA_KEY = CFG.usdaApiKey || 'DEMO_KEY';
const MEALS = ['Breakfast','Lunch','Dinner','Snacks'];
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n0 = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
const r0 = n => Math.round(n || 0);
const r1 = n => Math.round((n || 0) * 10) / 10;
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const clean = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const ymd = d => { const x = new Date(d); return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`; };
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const fmtShort = s => parseYmd(s).toLocaleDateString(undefined, {month:'short', day:'numeric'});
function dayLabel(s){
  const t = today();
  if (s === t) return 'Today';
  if (s === addDays(t,-1)) return 'Yesterday';
  if (s === addDays(t,1)) return 'Tomorrow';
  return parseYmd(s).toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
}
function toast(msg, undo){
  const t = $('#toast'); clearTimeout(toast.t);
  t.textContent = msg; t.classList.toggle('act', !!undo);
  if (undo){ const b = document.createElement('button'); b.textContent = 'Undo'; b.onclick = () => { undo(); t.classList.remove('on','act'); }; t.appendChild(b); }
  t.classList.add('on'); toast.t = setTimeout(() => t.classList.remove('on','act'), undo ? 6000 : 2400);
}
const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); });
const titleCase = s => s.toLowerCase().replace(/\b([a-z])/g, m => m.toUpperCase());

/* ================= Nutrition helpers ================= */
// A "unit" is {label, kcal, p, c, f} = nutrition for 1 of that unit.
const mk = (label, k, p, c, f, scale=1) => ({label, kcal:k*scale, p:p*scale, c:c*scale, f:f*scale});
const gramUnits = x => [mk('g', x.kcal, x.p, x.c, x.f, 0.01), mk('oz', x.kcal, x.p, x.c, x.f, 0.283495)];
function dedupeUnits(units){ const seen = new Set(); return units.filter(u => !seen.has(u.label) && seen.add(u.label)); }

// "1 portion (28 g)" -> "1 portion · 28 g"; "39 g" -> "serving · 39 g"
function servingLabel(s){
  s = String(s || '').trim();
  if (!s) return 'serving';
  const m = s.match(/^(.*?)\s*\(([^()]+)\)\s*$/);
  if (m && m[1]) return `${m[1]} · ${m[2]}`;
  if (/^[\d.,]+\s*(g|ml|oz)$/i.test(s)) return `serving · ${s}`;
  return s;
}
function offToFood(p){
  const n = p.nutriments || {};
  let k100 = n['energy-kcal_100g'];
  if (k100 == null && n['energy_100g'] != null) k100 = n['energy_100g'] / 4.184;
  const per100 = k100 != null ? {kcal:n0(k100), p:n0(n.proteins_100g), c:n0(n.carbohydrates_100g), f:n0(n.fat_100g)} : null;
  const units = [];
  const sq = n0(p.serving_quantity);
  const sl = servingLabel(p.serving_size);
  if (n['energy-kcal_serving'] != null) units.push(mk(sl, n0(n['energy-kcal_serving']), n0(n.proteins_serving), n0(n.carbohydrates_serving), n0(n.fat_serving)));
  else if (per100 && sq > 0) units.push(mk(sl, per100.kcal, per100.p, per100.c, per100.f, sq/100));
  if (per100) units.push(...gramUnits(per100));
  const name = (p.product_name || p.generic_name || '').trim();
  if (!units.length || !name) return null;
  return checkServing({name, brand:(p.brands || '').split(',')[0].trim(), code:p.code || '', src:'Open Food Facts', units:dedupeUnits(units)});
}

function fdcToFood(f){
  const nut = f.foodNutrients || [];
  const get = (...ids) => { for (const id of ids){ const x = nut.find(n => n.nutrientId === id); if (x && x.value != null) return x.value; } return null; };
  let kcal = get(1008, 2047, 2048);
  if (kcal == null){ const kj = get(1062); if (kj != null) kcal = kj / 4.184; }
  if (kcal == null) return null;
  const x = {kcal, p:n0(get(1003)), c:n0(get(1005)), f:n0(get(1004))};
  const units = [];
  const su = (f.servingSizeUnit || '').toLowerCase();
  if (f.servingSize > 0 && ['g','grm','ml','mlt'].includes(su)){
    const u = su.startsWith('m') ? 'ml' : 'g';
    const lbl = f.householdServingFullText ? `${f.householdServingFullText} · ${r0(f.servingSize)} ${u}` : `serving · ${r0(f.servingSize)} ${u}`;
    units.push(mk(lbl, x.kcal, x.p, x.c, x.f, f.servingSize/100));
  }
  for (const m of (f.foodMeasures || []).slice(0, 6)){
    if (m.gramWeight > 0 && m.disseminationText && !/not specified/i.test(m.disseminationText))
      units.push(mk(`${m.disseminationText} · ${r0(m.gramWeight)} g`, x.kcal, x.p, x.c, x.f, m.gramWeight/100));
  }
  units.push(...gramUnits(x));
  const branded = f.dataType === 'Branded';
  const d = f.description || '';
  const name = d === d.toUpperCase() ? titleCase(d) : d;
  const brand = branded ? titleCase(f.brandName || f.brandOwner || '') : '';
  return checkServing({name, brand, code:f.gtinUpc || '', src:'USDA', generic:!branded, units:dedupeUnits(units)});
}

// Label servings from the databases are sometimes wrong. If one looks implausible,
// put grams first (so the default is 100 g) and flag it for the amount screen.
function checkServing(food){
  const s = food.units[0], g = food.units.find(u => u.label === 'g');
  if (!s || s.label === 'g' || !g || g.kcal <= 0) return food;
  const grams = s.kcal / g.kcal;   // implied serving weight
  if (s.kcal > 1500 || grams > 1000 || grams < 1){
    food.units = [g, ...food.units.filter(u => u !== g)];
    food.suspect = true;
  }
  return food;
}
function foodUnits(food){
  if (food.items) return mealToFood(food).units;
  if (food.units && food.units.length) return food.units;
  const s = food.serving || {};
  const units = [mk(s.label || 'serving', n0(s.kcal), n0(s.p), n0(s.c), n0(s.f))];
  const g = n0(s.grams);
  if (g > 0) units.push(...gramUnits({kcal:n0(s.kcal)*100/g, p:n0(s.p)*100/g, c:n0(s.c)*100/g, f:n0(s.f)*100/g}));
  return dedupeUnits(units);
}
function itemTotals(it){ const u = (it.units || [])[it.unit || 0] || {kcal:0,p:0,c:0,f:0}; const q = n0(it.qty); return {kcal:u.kcal*q, p:u.p*q, c:u.c*q, f:u.f*q}; }
function sum(items){ return items.reduce((a, it) => { const t = itemTotals(it); return {kcal:a.kcal+t.kcal, p:a.p+t.p, c:a.c+t.c, f:a.f+t.f}; }, {kcal:0,p:0,c:0,f:0}); }
function mealToFood(m){
  const t = sum(m.items || []); const n = Math.max(1, n0(m.servings) || 1), cg = n0(m.cookedG);
  const units = [mk(n > 1 ? 'serving' : 'meal', t.kcal, t.p, t.c, t.f, 1/n)];
  if (cg > 0) units.push(...gramUnits({kcal:t.kcal * 100 / cg, p:t.p * 100 / cg, c:t.c * 100 / cg, f:t.f * 100 / cg}));
  const brand = (n > 1 ? `Recipe · makes ${n}` : 'Saved meal') + (cg > 0 ? ` · batch ${r0(cg).toLocaleString()} g` : '');
  return {id:m.id, by:m.by || '', isMeal:true, name:m.name || 'Saved meal', brand, src:'Saved meal', units};
}
function niceLabel(l){
  l = String(l || '');
  let m = l.match(/^serving \((.+)\)$/); if (m) l = servingLabel(m[1]);
  m = l.match(/^(.*\S)\s*\((\d[\d.,]*\s*(?:g|ml))\)$/); if (m) l = `${m[1]} · ${m[2]}`;
  return l;
}
const unitLine = (u, q=1) => { const l = niceLabel(u.label); return q == 1 && l !== 'g' && l !== 'oz' ? l : /^[\d.½¼¾⅓]/.test(l) ? `${r1(q)} × ${l}` : `${r1(q)} ${l}`; };
const defQty = u => u && (u.label === 'g' || u.label === 'ml') ? 100 : 1;
const fmtQtyUnit = it => { const u = (it.units || [])[it.unit || 0]; return u ? unitLine(u, it.qty) : ''; };

/* ================= Calorie target ================= */
const ACTIVITY = [[1.2,'Sedentary (desk job, little exercise)'],[1.375,'Light (exercise 1-3 days/week)'],[1.55,'Moderate (exercise 3-5 days/week)'],[1.725,'Very active (hard exercise 6-7 days/week)']];
const RATES = [[-1,'Gain 1 lb/week'],[-0.5,'Gain 0.5 lb/week'],[0,'Maintain weight'],[0.5,'Lose 0.5 lb/week'],[1,'Lose 1 lb/week'],[1.5,'Lose 1.5 lb/week'],[2,'Lose 2 lb/week']];
function calcTarget(p, weights){
  const ma = movingAvg(weights);
  const latest = ma.length ? ma[ma.length-1] : null;   // 7-day average smooths daily water-weight swings
  const out = {latest, target:null, auto:false};
  if (latest && p.sex && p.birthYear && p.heightIn){
    const kg = latest * 0.45359237, cm = p.heightIn * 2.54, age = new Date().getFullYear() - p.birthYear;
    out.bmr = 10*kg + 6.25*cm - 5*age + (p.sex === 'male' ? 5 : -161);
    out.tdee = out.bmr * (n0(p.activity) || 1.2);
    let t = out.tdee - n0(p.rate) * 500;
    const floor = p.sex === 'male' ? 1500 : 1200;
    if (t < floor){ t = floor; out.floored = true; }
    out.target = Math.round(t / 10) * 10; out.auto = true;
  }
  if (n0(p.targetOverride) > 0){ out.target = n0(p.targetOverride); out.auto = false; out.override = true; }
  return out;
}
function macroSplit(p){
  const m = p.macros || {};
  const v = (x, d) => x !== undefined && x !== null && x !== '' && isFinite(+x) ? +x : d;
  const s = {p:v(m.p, 30), c:v(m.c, 40), f:v(m.f, 30)};
  return Math.round(s.p + s.c + s.f) === 100 ? s : {p:30, c:40, f:30};
}
function movingAvg(ws){
  return ws.map((w, i) => { const start = addDays(w.date, -6); let s = 0, n = 0; for (let j = i; j >= 0 && ws[j].date >= start; j--){ s += ws[j].lb; n++; } return s / n; });
}

/* ================= Backends ================= */
function localBackend(){
  const KEY = 'plate-demo-v1';
  let db = null; try { db = JSON.parse(localStorage.getItem(KEY)); } catch {}
  db = db || {profile:{householdId:'DEMO'}, days:{}, weights:{}, foods:{}, meals:{}};
  const subs = new Set();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} subs.forEach(f => f()); };
  const sub = fn => { subs.add(fn); queueMicrotask(fn); return () => subs.delete(fn); };
  return {
    mode:'demo',
    onAuth(cb){ cb({uid:'demo', email:'Demo mode'}); },
    async signIn(){}, async signUp(){}, async signOut(){ toast('Demo mode has no account.'); }, async resetPw(){},
    watchProfile(cb){ return sub(() => cb(structuredClone(db.profile), false)); },
    setProfile(p){ db.profile = {...db.profile, ...clean(p)}; save(); },
    watchDay(date, cb){ return sub(() => cb(structuredClone(db.days[date] || []), (db.goals || {})[date] || null)); },
    setDay(date, entries, goal){ db.days[date] = clean(entries); if (goal){ db.goals = db.goals || {}; db.goals[date] = goal; } save(); },
    async exportAll(){ return {days:Object.entries(db.days).map(([date, e]) => ({date, entries:e})), weights:Object.entries(db.weights).map(([date, lb]) => ({date, lb}))}; },
    watchWeights(cb){ return sub(() => cb(Object.entries(db.weights).map(([date, lb]) => ({date, lb})).sort((a, b) => a.date < b.date ? -1 : 1))); },
    setWeight(date, lb){ db.weights[date] = lb; save(); },
    delWeight(date){ delete db.weights[date]; save(); },
    async ensureHousehold(){ return 'DEMO'; },
    async joinHousehold(){ throw new Error('Households need Firebase set up first.'); },
    watchLib(hid, cb){ return sub(() => cb({foods:structuredClone(Object.values(db.foods)), meals:structuredClone(Object.values(db.meals))})); },
    watchHousehold(hid, cb){ return sub(() => cb({members:['demo'], names:{}})); },
    setMemberName(){},
    saveFood(hid, f){ f = clean(f); f.id = f.id || uid(); db.foods[f.id] = f; save(); return f.id; },
    delFood(hid, id){ delete db.foods[id]; save(); },
    saveMeal(hid, m){ m = clean(m); m.id = m.id || uid(); db.meals[m.id] = m; save(); return m.id; },
    delMeal(hid, id){ delete db.meals[id]; save(); },
  };
}

async function firebaseBackend(){
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [{initializeApp}, A, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = initializeApp(FB);
  const auth = A.getAuth(app);
  let db;
  try { db = F.initializeFirestore(app, {localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})}); }
  catch { db = F.getFirestore(app); }
  let me = null;
  const uref = () => F.doc(db, 'users', me.uid);
  const err = e => { console.error(e); toast('Sync problem: ' + (e.code || e.message)); };
  const strip = o => { const x = clean(o); delete x.id; return x; };
  const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const newCode = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), b => CODE_CHARS[b % CODE_CHARS.length]).join('');
  return {
    mode:'cloud',
    onAuth(cb){ A.onAuthStateChanged(auth, u => { me = u; cb(u ? {uid:u.uid, email:u.email} : null); }); },
    signIn:(e, p) => A.signInWithEmailAndPassword(auth, e, p),
    signUp:(e, p) => A.createUserWithEmailAndPassword(auth, e, p),
    signOut:() => A.signOut(auth),
    resetPw:e => A.sendPasswordResetEmail(auth, e),
    watchProfile(cb){ return F.onSnapshot(uref(), s => cb(s.data() || {}, s.metadata.fromCache), err); },
    setProfile(p){ F.setDoc(uref(), clean(p), {merge:true}).catch(err); },
    watchDay(date, cb){ return F.onSnapshot(F.doc(db, 'users', me.uid, 'days', date), s => { const d = s.data() || {}; cb(d.entries || [], d.goal || null); }, err); },
    setDay(date, entries, goal){ F.setDoc(F.doc(db, 'users', me.uid, 'days', date), goal ? {entries:clean(entries), goal} : {entries:clean(entries)}).catch(err); },
    async exportAll(){
      const [ds, ws] = await Promise.all([F.getDocs(F.collection(db, 'users', me.uid, 'days')), F.getDocs(F.collection(db, 'users', me.uid, 'weights'))]);
      return {days:ds.docs.map(d => ({date:d.id, entries:d.data().entries || []})), weights:ws.docs.map(d => ({date:d.id, lb:d.data().lb}))};
    },
    watchWeights(cb){ return F.onSnapshot(F.collection(db, 'users', me.uid, 'weights'), qs => cb(qs.docs.map(d => ({date:d.id, lb:d.data().lb})).sort((a, b) => a.date < b.date ? -1 : 1)), err); },
    setWeight(date, lb){ F.setDoc(F.doc(db, 'users', me.uid, 'weights', date), {lb}).catch(err); },
    delWeight(date){ F.deleteDoc(F.doc(db, 'users', me.uid, 'weights', date)).catch(err); },
    async ensureHousehold(){
      const id = newCode();
      await F.setDoc(F.doc(db, 'households', id), {members:[me.uid], created:Date.now()});
      await F.setDoc(uref(), {householdId:id}, {merge:true});
      return id;
    },
    async joinHousehold(code){
      const id = code.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
      try { await F.updateDoc(F.doc(db, 'households', id), {members:F.arrayUnion(me.uid)}); }
      catch(e){ throw new Error(e.code === 'permission-denied' || e.code === 'not-found' ? 'That code was not found.' : (e.message || 'Could not join.')); }
      await F.setDoc(uref(), {householdId:id}, {merge:true});
      return id;
    },
    watchHousehold(hid, cb){ return F.onSnapshot(F.doc(db, 'households', hid), s => cb(s.data() || {members:[], names:{}}), () => {}); },
    setMemberName(hid, name){ F.updateDoc(F.doc(db, 'households', hid), {[`names.${me.uid}`]:name}).catch(() => {}); },
    watchLib(hid, cb){
      let foods = [], meals = [];
      const u1 = F.onSnapshot(F.collection(db, 'households', hid, 'foods'), qs => { foods = qs.docs.map(d => ({...d.data(), id:d.id})); cb({foods, meals}); }, err);
      const u2 = F.onSnapshot(F.collection(db, 'households', hid, 'meals'), qs => { meals = qs.docs.map(d => ({...d.data(), id:d.id})); cb({foods, meals}); }, err);
      return () => { u1(); u2(); };
    },
    saveFood(hid, f){ const id = f.id || uid(); F.setDoc(F.doc(db, 'households', hid, 'foods', id), strip(f)).catch(err); return id; },
    delFood(hid, id){ F.deleteDoc(F.doc(db, 'households', hid, 'foods', id)).catch(err); },
    saveMeal(hid, m){ const id = m.id || uid(); F.setDoc(F.doc(db, 'households', hid, 'meals', id), strip(m)).catch(err); return id; },
    delMeal(hid, id){ F.deleteDoc(F.doc(db, 'households', hid, 'meals', id)).catch(err); },
  };
}

function macroBar(label, val, target, color){
  const pct = target ? Math.min(100, val / target * 100) : 0;
  return `<div><div>${label}</div><div class="bar"><i style="width:${pct}%;background:${color}"></i></div><div class="muted" style="margin-top:3px">${r0(val)}${target ? ' / ' + r0(target) : ''} g</div></div>`;
}

function chartSVG(){
  const ws = S.weights, ma = movingAvg(ws);
  const cutoff = S.wRange === 'all' ? '0000' : addDays(today(), -S.wRange);
  const pts = ws.map((w, i) => ({...w, avg:ma[i]})).filter(p => p.date >= cutoff);
  if (pts.length < 2) return '<p class="empty">Log at least two weigh-ins to see a chart.</p>';
  const W = 340, H = 190, pl = 34, pr = 8, pt = 10, pb = 22;
  const t0 = parseYmd(pts[0].date).getTime(), t1 = parseYmd(pts[pts.length-1].date).getTime();
  let lo = Math.min(...pts.map(p => Math.min(p.lb, p.avg))), hi = Math.max(...pts.map(p => Math.max(p.lb, p.avg)));
  const goal = n0(S.profile.goalWeight);
  const showGoal = goal && goal >= lo - 8 && goal <= hi + 8;
  if (showGoal){ lo = Math.min(lo, goal); hi = Math.max(hi, goal); }
  const padv = (hi - lo) * 0.12 || 1; lo -= padv; hi += padv;
  const x = d => pl + (parseYmd(d).getTime() - t0) / ((t1 - t0) || 1) * (W - pl - pr);
  const y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  let g = '';
  for (let i = 0; i <= 3; i++){ const v = lo + (hi - lo) * i / 3; g += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-4}" y="${y(v)+3}" text-anchor="end">${hi - lo < 8 ? r1(v) : r0(v)}</text>`; }
  if (showGoal) g += `<line x1="${pl}" x2="${W-pr}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--acc)" stroke-dasharray="4 4"/><text x="${W-pr}" y="${y(goal)-4}" text-anchor="end">goal</text>`;
  const dots = pts.map(p => `<circle cx="${x(p.date)}" cy="${y(p.lb)}" r="2.5" fill="var(--muted)" opacity=".6"/>`).join('');
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.date).toFixed(1)},${y(p.avg).toFixed(1)}`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Weight chart">${g}${dots}<path d="${line}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/><text x="${pl}" y="${H-6}">${fmtShort(pts[0].date)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${fmtShort(pts[pts.length-1].date)}</text></svg>
    <div class="small muted">Dots are daily weigh-ins. The line is the 7-day average.</div>`;
}

/* ---- Weekly summary: the 7 full days before today ---- */
function weekRange(){ const end = addDays(today(), -1); return {start:addDays(end, -6), end}; }
async function loadWeek(){
  const {start, end} = weekRange(), key = start;
  if (S.weekLoading || (S.week && S.week.key === key && Date.now() - S.week.at < 60000)) return;
  S.weekLoading = true;
  const dates = []; for (let d = start; d <= end; d = addDays(d, 1)) dates.push(d);
  const days = await Promise.all(dates.map(d => loadDay(d).then(e => ({date:d, e}))));
  S.week = {key, at:Date.now(), days}; S.weekLoading = false;
  if (S.tab === 'weight') render();
}
// Trend value (7-day average) as of a date: the average at the last weigh-in on or before it,
// only if that weigh-in is within 3 days so a stale reading isn't passed off as current.
function trendAt(date){
  const ws = S.weights, ma = movingAvg(ws);
  for (let i = ws.length - 1; i >= 0; i--) if (ws[i].date <= date) return ws[i].date >= addDays(date, -3) ? ma[i] : null;
  return null;
}
function weekCard(){
  const {start, end} = weekRange();
  const title = `<div class="mealhead"><h2>Past 7 days</h2><span class="muted small">${fmtShort(start)} – ${fmtShort(end)}</span></div><div class="small muted">Previous 7 days, not including today. Averages count any day with at least one entry.</div>`;
  if (!S.week || S.week.key !== start){ loadWeek(); return `<div class="card">${title}<p class="empty">Loading…</p></div>`; }
  const logged = S.week.days.filter(d => d.e.length);
  const n = logged.length;
  const t = calcTarget(S.profile, S.weights);
  const avg = k => n ? logged.reduce((a, d) => a + sum(d.e)[k], 0) / n : 0;
  const kc = avg('kcal'), pr = avg('p');
  const now = trendAt(end), before = trendAt(addDays(end, -7));
  const change = now != null && before != null ? now - before : null;
  const pTarget = t.target ? t.target * macroSplit(S.profile).p / 400 : null;
  const line = (label, value, sub) => `<div class="row" style="justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)"><span>${label}</span><span class="right"><b>${value}</b>${sub ? `<div class="small muted">${sub}</div>` : ''}</span></div>`;
  if (!n && change == null) return `<div class="card">${title}<p class="small muted" style="margin:10px 0 0">Your weekly summary fills in after your first full day of logging. Check back tomorrow.</p></div>`;
  let body = line('Days logged', `${n} of 7`, '');
  if (n){
    body += line('Average calories', r0(kc).toLocaleString(), `per logged day${t.target ? ` · goal ${r0(t.target).toLocaleString()}` : ''}`);
    body += line('Average protein', `${r0(pr)} g`, `per logged day${pTarget ? ` · goal ${r0(pTarget)} g` : ''}`);
  }
  body += line('Weight trend', change == null ? '–' : `${change > 0 ? '+' : change < 0 ? '−' : ''}${Math.abs(r1(change))} lb`, change == null ? 'needs weigh-ins in both weeks' : 'vs prior week, 7-day avg');
  const note = !n ? 'Nothing logged in these 7 days yet.' : n < 7 ? `Averages use only the ${n === 1 ? 'one day' : n + ' days'} you logged. Days without entries are left out, not counted as zero.` : '';
  return `<div class="card">${title}<div style="margin-top:6px">${body}</div>${note ? `<p class="small muted" style="margin:8px 0 0">${note}</p>` : ''}</div>`;
}

      <div><span>7-day average</span><b>${avg ? r1(avg) : '–'}</b><span>lb</span></div>
      <div><span>Last 30 days</span><b>${change != null ? sign(change) : '–'}</b><span>lb (avg)</span></div>
      <div><span>To goal</span><b>${goal && avg ? r1(Math.abs(avg - goal)) : '–'}</b><span>${goal ? 'goal ' + goal + ' lb' : 'set in Profile'}</span></div>
    </div>
    <div class="card"><div class="seg" style="margin-top:0">${[[30,'30 days'],[90,'90 days'],[365,'1 year'],['all','All']].map(([v, l]) => `<button data-act="wrange" data-v="${v}" class="${String(S.wRange) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</div>${chartSVG()}</div>`}
    <div class="card"><h2>History</h2><div class="list">${ws.length ? ws.slice().reverse().slice(0, 60).map(w => `<div class="item"><div>${esc(dayLabel(w.date))}</div><div class="row"><b>${r1(w.lb)} lb</b><button class="btn danger" data-act="del-weight" data-date="${w.date}" aria-label="Delete">✕</button></div></div>`).join('') : '<p class="empty">No weigh-ins yet.</p>'}</div></div>`;

const addedBy = f => f.by && f.by !== S.profile.name ? `added by ${f.by}` : '';
function libList(q){
  const ql = (q || '').toLowerCase();
  const foods = S.lib.foods.map(f => ({...f, units:foodUnits(f), kind:'food'}));
  const meals = S.lib.meals.map(m => ({...mealToFood(m), kind:'meal', raw:m}));
  return [...meals, ...foods].filter(f => !ql || (f.name + ' ' + (f.brand || '')).toLowerCase().includes(ql)).sort((a, b) => a.name.localeCompare(b.name));

async function searchUSDA(q){
  const url = `https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${encodeURIComponent(USDA_KEY)}&query=${encodeURIComponent(q)}&pageSize=30&dataType=${encodeURIComponent('Foundation,SR Legacy,Survey (FNDDS),Branded')}`;
  const r = await fetch(url);
  if (r.status === 429) throw new Error('USDA search limit reached for this hour. Add a free USDA key in config.js.');
  if (!r.ok) throw new Error('USDA search failed (' + r.status + ').');
  const j = await r.json();
  const out = (j.foods || []).map(fdcToFood).filter(Boolean);
  return out.filter(f => f.generic).concat(out.filter(f => !f.generic));
}
async function searchOFF(q){
  const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=20&tagtype_0=countries&tag_contains_0=contains&tag_0=united-states&fields=code,product_name,generic_name,brands,serving_size,serving_quantity,nutriments`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('Open Food Facts search failed (' + r.status + ').');
  const j = await r.json();
  return (j.products || []).map(offToFood).filter(Boolean);
}
async function runSearch(q){
  A.q = q; A.tab = 'results';
  if (!q.trim()){ A.usda = {st:'done', list:[]}; A.off = {st:'done', list:[]}; renderSheet(); return; }
  const token = A.token = uid();
  A.usda = {st:'loading', list:[]}; A.off = {st:'loading', list:[]};
  renderSheet();
  const go = (key, fn) => fn(q).then(list => { if (A && A.token === token){ A[key] = {st:'done', list}; if (SHEET === renderAdd) renderSheet(); } })
    .catch(e => { if (A && A.token === token){ A[key] = {st:'error', list:[], err:e.message || 'Search failed.'}; if (SHEET === renderAdd) renderSheet(); } });
  go('usda', searchUSDA); go('off', searchOFF);
}

  try {
    if (!window.Html5Qrcode) await loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js');
    const FM = window.Html5QrcodeSupportedFormats;
    const sc = new window.Html5Qrcode('reader', {formatsToSupport:[FM.EAN_13, FM.EAN_8, FM.UPC_A, FM.UPC_E], experimentalFeatures:{useBarCodeDetectorIfSupported:true}, verbose:false});
    S.scanner = sc;
    let done = false;
    await sc.start({facingMode:'environment'}, {fps:10, qrbox:(w, h) => ({width:Math.floor(Math.min(w * 0.85, 320)), height:Math.floor(Math.min(h * 0.45, 160))})},
      text => { if (done || !validCode(text)) return; if (S.lastRead !== text){ S.lastRead = text; return; } done = true; S.lastRead = null; if (navigator.vibrate) navigator.vibrate(60); stopScan().then(() => SCAN.onCode(text)); }, () => {});

// UPC/EAN check digit: rejects partial or misread scans.
function validCode(c){
  if (!/^(\d{8}|\d{12}|\d{13}|\d{14})$/.test(c)) return false;
  const d = c.split('').map(Number), check = d.pop();
  const s = d.reverse().reduce((a, x, i) => a + x * (i % 2 === 0 ? 3 : 1), 0);
  return (10 - s % 10) % 10 === check;
}
async function lookupBarcode(code){
  const norm = c => String(c).replace(/^0+/, '');
  const local = S.lib.foods.find(f => f.code && norm(f.code) === norm(code));
  if (local) return {food:{...local, units:foodUnits(local)}};
  let netErr = 0, tried = 0;
  // 1) Open Food Facts
  const tries = [code]; if (code.length === 12) tries.push('0' + code); if (code.length === 13 && code[0] === '0') tries.push(code.slice(1));
  for (const c of tries){
    tried++;
    try {
      const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${c}.json?fields=code,product_name,generic_name,brands,serving_size,serving_quantity,nutriments`);
      if (r.status === 404) continue;
      if (!r.ok){ netErr++; continue; }
      const j = await r.json();
      if (j.status === 1 && j.product){ const f = offToFood({...j.product, code:c}); if (f) return {food:f}; }
    } catch { netErr++; }
  }
  // 2) USDA branded foods (strong US coverage)
  tried++;
  try {
    const url = `https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${encodeURIComponent(USDA_KEY)}&query=${encodeURIComponent(norm(code))}&dataType=Branded&pageSize=10`;
    const r = await fetch(url);
    if (r.ok){
      const j = await r.json();
      const hit = (j.foods || []).find(f => f.gtinUpc && norm(f.gtinUpc) === norm(code));
      if (hit){ const f = fdcToFood(hit); if (f) return {food:{...f, code}}; }
    } else netErr++;
  } catch { netErr++; }
  return {food:null, error: netErr >= tried ? 'network' : null};
}
async function handleCode(code){
  openSheet(() => `${head('Looking up', '‹ Back', 'back-add')}<p class="empty center">Looking up barcode ${esc(code)}…</p>`);
  const {food:f, error} = await lookupBarcode(code);
  if (!A) return;
  if (f){ openPortion({food:f, meal:A.meal, mode:A.mode, back:backToAdd}); return; }
  if (error === 'network'){ openSheet(() => `${head('Lookup failed', '‹ Back', 'back-add')}<div class="card"><p>Couldn't reach the food databases to look up barcode <b>${esc(code)}</b>.</p><p class="small muted">Check your signal and try scanning again.</p><button class="btn block" data-act="scan">Scan again</button></div>`); return; }

function authMsg(e){
  const c = e.code || '';
  if (/invalid-credential|wrong-password|user-not-found/.test(c)) return 'Email or password is incorrect.';
  if (/email-already-in-use/.test(c)) return 'An account with that email already exists. Sign in instead.';
  if (/weak-password/.test(c)) return 'Password must be at least 6 characters.';
  if (/invalid-email/.test(c)) return 'That email address is not valid.';
  if (/network/.test(c)) return 'No connection. Check your signal and try again.';
  if (/too-many-requests/.test(c)) return 'Too many attempts. Wait a few minutes and try again.';
  return e.message || 'Something went wrong.';
}

  catch(e){ $('#app').innerHTML = `<main><div class="card"><h2>Could not start</h2><p class="small">${esc(e.message || e)}</p><p class="small muted">Check your connection and the settings in config.js, then reload.</p></div></main>`; return; }
  S.be.onAuth(u => {
    stopAll(); S.user = u; S.hid = null; S.profile = {}; S.lib = {foods:[], meals:[]};
    SHEET = null; renderSheet();
    if (!u){ renderAuth(); return; }
    startData(); render(true); handleShortcut();
  });
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
window.__plate = {S, trendAt, validCode, lookupBarcode, offToFood, fdcToFood, calcTarget, foodUnits, sum, movingAvg, mealToFood};
boot();
</script>
